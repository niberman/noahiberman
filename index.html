<!doctype html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
  <!-- The site manages its own dark theme. Without these, dark-mode tooling
       (Dark Reader, Chrome Auto Dark) force-paints opaque backgrounds on every
       element, hiding the fixed WebGL flight map behind the page content. -->
  <meta name="color-scheme" content="only dark" />
  <meta name="darkreader-lock" />

  <!-- iOS specific meta tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />

  <!-- Primary Meta Tags -->

    content="Commercial pilot, software engineer, and Denver-based founder. Building Freedom Aviation, AI systems, and aviation technology solutions." />

  <meta name="keywords"
    content="Noah Berman, commercial pilot, aviation, Freedom Aviation, flight instructor, bilingual entrepreneur, aviation technology, aircraft management, flight training, The Language School, aviation startup, Spanish-English entrepreneur, ATP-rated pilot, multi-engine pilot, helicopter pilot" />

  <!-- Language -->
  <meta name="language" content="en-US" />
  <link rel="alternate" hreflang="en" href="https://noahiberman.com/" />

  <link rel="alternate" hreflang="x-default" href="https://noahiberman.com/" />

  <!-- Canonical -->

  <!-- Open Graph / Facebook -->

    content="Commercial pilot, bilingual entrepreneur, and founder building Freedom Aviation and innovative technology solutions." />

  <meta property="og:image:alt" content="Noah Berman — Founder, Pilot, Engineer, Visionary" />

  <meta property="og:locale" content="en_US" />

  <!-- Twitter -->

  <!-- Structured Data - Person Schema -->
  <script type="application/ld+json">

      "name": "Noah Berman",
      "url": "https://noahiberman.com",
      "image": "https://noahiberman.com/logo.png",
      "sameAs": [
        "https://github.com/niberman",
        "https://www.linkedin.com/in/noahiberman/"
      ],
      "jobTitle": ["Commercial Pilot", "Software Engineer"],
      "worksFor": [
        {
          "@type": "Organization",
          "name": "Freedom Aviation",
          "url": "https://freedomaviationco.com"
        },
        {
          "@type": "Organization",
          "name": "The Language School",
          "url": "https://thelanguageschool.us"
        }
      ],
      "knowsLanguage": ["en-US", "es-ES"],
      "alumniOf": "University of Deusto",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Denver",
        "addressRegion": "CO",
        "addressCountry": "US"
      },
      "description": "Commercial pilot, software engineer, and bilingual entrepreneur based in Denver, CO. Founder specializing in aviation services, AI systems, and technology solutions.",
      "hasCredential": [
        {
          "@type": "EducationalOccupationalCredential",
          "credentialCategory": "FAA Commercial Pilot License",
          "description": "FAA Commercial Pilot with Instrument Rating"
        },
        {
          "@type": "EducationalOccupationalCredential",

        {

  <!-- Structured Data - Organization Schema for Freedom Aviation -->
  <script type="application/ld+json">

      "@context": "https://schema.org",

      "name": "Freedom Aviation",
      "url": "https://freedomaviationco.com",

      },

      "serviceType": ["Aircraft Management", "Flight Instruction", "Aviation Services"]
    }
    </script>

  <!-- Structured Data - WebSite Schema -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Noah Berman",
      "url": "https://noahiberman.com",
      "description": "Portfolio and ventures of Noah Berman — Founder, Pilot, Engineer, Visionary",
      "inLanguage": ["en-US", "es-ES"],
      "author": {
        "@type": "Person",
        "name": "Noah Berman"
      }
    }
    </script>

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  <!-- Sitemap -->
  <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />

  <!-- The hero logo is the LCP image on mobile; without this it isn't
       discovered until React renders, seconds into the load. -->
  <link rel="preload" as="image" href="/logo.webp" type="image/webp" fetchpriority="high" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://yvblwphbfekmmpoxowjr.supabase.co" crossorigin />

  <!-- Fonts load without blocking first paint (display=swap shows fallback text
       immediately); the media swap defers stylesheet evaluation until loaded. -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap"
    media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" />
  </noscript>
</head>

<body>
  <!-- Static hero shell: paints FCP/LCP at HTML parse time, before any JS.
       createRoot().render() in src/main.tsx replaces it with identical markup —
       keep structure/classes in sync with src/App.tsx wrappers and the hero in
       src/pages/Home.tsx (elements framer-motion starts hidden carry inline
       opacity/transform so layout is reserved with zero shift). -->
  <div id="root">
    <div class="min-h-screen flex flex-col relative">
      <div class="flex-1 relative z-10">
        <main class="min-h-screen relative">
          <div class="relative z-10 pointer-events-none [&>*]:pointer-events-auto">
            <section id="home"
              class="relative min-h-screen flex items-center justify-center overflow-hidden px-4 sm:px-6">
              <div class="absolute inset-0 bg-gradient-to-b from-background/70 via-background/30 to-background/70">
              </div>
              <div class="container mx-auto px-4 relative z-10 pb-16 sm:pb-20">
                <div class="text-center max-w-5xl mx-auto">
                  <div
                    class="inline-block mb-6 sm:mb-8 h-16 w-16 sm:h-20 sm:w-20 md:h-24 md:w-24 overflow-hidden rounded drop-shadow-glow animate-float relative">
                    <picture>
                      <source srcset="/logo.webp" type="image/webp" />
                      <img src="/logo.png" alt="Noah Berman logo" width="96" height="96" fetchpriority="high"
                        class="absolute inset-0 w-full h-full object-contain origin-center" />
                    </picture>
                  </div>
                  <p style="opacity:0;transform:translateY(20px)"
                    class="text-lg sm:text-xl md:text-2xl font-display text-secondary mb-2">Noah Berman</p>
                  <h1
                    class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl xl:text-8xl font-display font-bold mb-4 sm:mb-6 text-primary-foreground text-balance leading-tight">
                    Founder, Pilot, Visionary</h1>
                  <div style="opacity:0;transform:translateY(30px)" class="space-y-2 sm:space-y-3 mb-6 sm:mb-8">
                    <p class="text-xl sm:text-2xl md:text-3xl text-primary-foreground/95 font-light text-balance px-4">
                      The sky is not the limit</p>
                    <p class="text-lg sm:text-xl md:text-2xl text-secondary font-display italic px-4">El cielo no es el
                      límite</p>
                  </div>
                  <div style="opacity:0;transform:translateY(20px)"
                    class="flex flex-col sm:flex-row gap-4 sm:gap-5 justify-center items-center px-4">
                    <button
                      class="inline-flex items-center justify-center gap-2 whitespace-nowrap font-medium h-11 text-base sm:text-lg px-8 sm:px-10 py-5 sm:py-6 rounded-full w-full sm:w-auto">Book
                      a Meeting</button>
                    <button
                      class="inline-flex items-center justify-center gap-2 whitespace-nowrap font-medium border h-11 text-base sm:text-lg px-8 sm:px-10 py-5 sm:py-6 rounded-full w-full sm:w-auto">Blog</button>
                    <button
                      class="inline-flex items-center justify-center gap-2 whitespace-nowrap font-medium h-11 text-base sm:text-lg px-6 py-5 sm:py-6 rounded-full w-full sm:w-auto">Get
                      in Touch</button>
                  </div>
                </div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
