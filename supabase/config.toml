
[functions.notify_contact_message]
enabled = true
# Disabled JWT verification - function uses webhook secret for auth instead
verify_jwt = false
import_map = "./functions/notify_contact_message/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/notify_contact_message/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/notify_contact_message/*.html" ]

[functions.inoah-chat]
enabled = true
# Public endpoint - auth handled via rate limiting + optional Turnstile
verify_jwt = false
entrypoint = "./functions/inoah-chat/index.ts"

[functions.inoah-sync-drive]
enabled = true
# Secret-gated like notify_contact_message: the hourly pg_cron job sends the
# SYNC_SECRET bearer from Vault
verify_jwt = false
entrypoint = "./functions/inoah-sync-drive/index.ts"

# Archived 2026-08-19: deployed but never called from the app, and their tables
# now live in the `archive` schema. Left in the tree so the source is still
# here; `enabled = false` keeps a bulk deploy from putting them back. To revive
# one, flip this and move its table back out of `archive`.
[functions.linkedin-agent]
enabled = false
entrypoint = "./functions/linkedin-agent/index.ts"

[functions.generate-post]
enabled = false
entrypoint = "./functions/generate-post/index.ts"

[functions.crm-contacts]
enabled = false
entrypoint = "./functions/crm-contacts/index.ts"
